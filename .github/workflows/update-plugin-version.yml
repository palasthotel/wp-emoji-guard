name: Update plugin version

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - main

permissions:
  contents: read

jobs:
  sync-version:
    uses: palasthotel/github-workflows/.github/workflows/wp-plugin-sync-version.yml@feat/wp-plugin-workflows
    with:
      app-id: ${{ vars.RELEASE_BOT_APP_ID }}
      tools-ref: feat/wp-plugin-workflows
    secrets: inherit
